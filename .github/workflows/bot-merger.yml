name: bot-merger
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to enable auto-merge on
        required: true
permissions:
  pull-requests: write
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: enable auto-merge as GITHUB_TOKEN (bot identity)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ inputs.pr }}" --repo DUElost/stp-auto-close-probe --auto --merge
